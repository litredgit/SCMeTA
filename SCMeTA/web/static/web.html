<!DOCTYPE html>
<html>
<head>
    <title>SCMeTA Cluster Web</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7fa;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            border-right: 1.5px solid #e5e7eb;
            padding: 24px 0;
            box-shadow: 2px 0 8px 0 #e0e7ef33;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            padding: 14px 28px;
            cursor: pointer;
            color: #e0e7ef;
            font-size: 1.08em;
            border-radius: 8px 0 0 8px;
            margin-bottom: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar li:hover {
            background: #60a5fa;
            color: #fff;
        }
        .sidebar li.active {
            background: #fff;
            color: #2563eb;
            font-weight: bold;
            box-shadow: 2px 0 8px 0 #e0e7ef33;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: center;
            padding: 40px 0 0 0;
            height: 100vh;
            box-sizing: border-box;
            min-width: 0;
        }
        .main-left {
            width: 35%;
            min-width: 220px;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            overflow-y: auto;
            height: 80vh;
            min-width: 0;
            transition: width 0.2s;
            box-sizing: border-box;
            padding-left: 0;
            padding-right: 0;
        }
        .step-content {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px 0 #e0e7ef55;
            padding: 14px 6px 10px 6px;
            margin-bottom: 18px;
            width: 100%;
            max-width: 320px;
            min-width: 0;
            box-sizing: border-box;
        }
        .resizer {
            width: 8px;
            background: linear-gradient(90deg, #e0e7ef 60%, #2563eb22 100%);
            cursor: ew-resize;
            height: 80vh;
            align-self: stretch;
            border-radius: 6px;
            margin: 0 0.5vw;
            transition: background 0.2s;
            z-index: 2;
        }
        .resizer:hover, .resizer.active {
            background: linear-gradient(90deg, #60a5fa 0%, #2563eb 100%);
        }
        .main-right {
            width: 65%;
            min-width: 320px;
            max-width: 1000px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px 0 #e0e7ef55;
            padding: 32px 18px 18px 18px;
            display: flex;
            flex-direction: column;
            height: 80vh;
            box-sizing: border-box;
            overflow-y: auto;
            min-width: 0;
            transition: width 0.2s;
        }
        h2 {
            margin-top: 0;
            color: #2563eb;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        label {
            color: #374151;
            font-size: 0.98em;
            margin-bottom: 4px;
            display: block;
        }
        input, select {
            width: 92%;
            max-width: 240px;
            min-width: 80px;
            padding: 8px 12px;
            margin: 6px 0 16px 0;
            border: 1.2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1em;
            background: #f9fafb;
            transition: border 0.2s;
            box-sizing: border-box;
            display: block;
        }
        input:focus, select:focus {
            border: 1.5px solid #2563eb;
            outline: none;
            background: #fff;
        }
        button {
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 32px;
            font-size: 1.08em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 2px 8px 0 #3b82f633;
            transition: background 0.2s, box-shadow 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
            box-shadow: 0 4px 16px 0 #2563eb33;
        }
        textarea#output {
            width: 100%;
            min-width: 0;
            min-height: 320px;
            max-height: 60vh;
            background: #18181b;
            color: #e0e7ef;
            border-radius: 10px;
            border: 1.5px solid #2563eb;
            font-family: 'Fira Mono', 'Consolas', monospace;
            font-size: 1em;
            margin-top: 12px;
            padding: 14px;
            box-shadow: 0 2px 12px 0 #2563eb22;
            resize: vertical;
            overflow-y: auto;
            box-sizing: border-box;
        }
        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1.5px solid #e5e7eb; flex-direction: row; }
            .main { flex-direction: column; padding: 16px 0 0 0; height: unset; }
            .main-left, .main-right {
                min-width: unset;
                max-width: 98vw;
                width: 100%;
                height: unset;
            }
            .resizer { display: none; }
            .step-content { min-width: unset; max-width: 98vw; }
        }
    </style>
    <script>
        let socket;
        let currentStep = 0;
        window.onload = function() {
            socket = io();
            socket.on('terminal_output', function(payload) {
                let out = document.getElementById('output');
                out.value += `[${payload.type}] ${payload.message}`;
                out.scrollTop = out.scrollHeight;
            });
            socket.on('step_done', function(payload) {
                let out = document.getElementById('output');
                out.value += `\n[STEP DONE] ${payload.step}\n`;
                out.scrollTop = out.scrollHeight;
            });
            showStep(0);
        }
        function emitSocket(event, data) {
            socket.emit(event, data);
        }
        function showStep(idx) {
            currentStep = idx;
            let steps = document.querySelectorAll('.sidebar li');
            steps.forEach((li, i) => li.classList.toggle('active', i === idx));
            let contents = document.querySelectorAll('.step-content');
            contents.forEach((div, i) => div.style.display = (i === idx ? 'block' : 'none'));
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <ul>
                <li class="active" onclick="showStep(0)">1. 初始化</li>
                <li onclick="showStep(1)">2. 导入数据</li>
                <li onclick="showStep(2)">3. 预处理</li>
                <li onclick="showStep(3)">4. 处理</li>
                <li onclick="showStep(4)">5. 后处理</li>
                <li onclick="showStep(5)">6. 保存</li>
            </ul>
        </div>
        <div class="main">
            <div class="main-left" id="mainLeft">
                <div class="step-content" style="display:block">
                    <h2>Step 1: 初始化 (Process.__init__)</h2>
                    <div>
                        <label>ref_mz (float): 参考m/z, 用于初始化</label><br>
                        <input id="ref_mz" placeholder="ref_mz" value="760.58">
                    </div>
                    <div>
                        <label>config_path (str): 读取配置文件路径</label><br>
                        <input id="config_path" placeholder="config_path">
                    </div>
                    <div>
                        <label>renew (bool): 是否重新生成配置文件</label><br>
                        <select id="renew" placeholder="renew">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                    <button onclick="emitSocket('init', {
                        ref_mz: parseFloat(ref_mz.value), 
                        config_path: config_path.value
                    })">初始化</button>
                </div>
                <div class="step-content" style="display:none">
                    <h2>Step 2: 导入数据 (Process.load)</h2>
                    <div><label>path (str): 数据文件或文件夹路径</label><br><input id="load_path" placeholder="path"></div>
                    <div>
                        <label>log_file (str): 日志文件保存路径</label><br>
                        <select id="log_file" onchange="toggleCustomLogFile(this)">
                            <option value="">不保存</option>
                            <option value="cwd">cwd</option>
                            <option value="data">data</option>
                            <option value="custom">自定义</option>
                        </select>
                        <input id="custom_log_file" placeholder="自定义路径" style="display:none" oninput="updateLogFileValue(this)">
                    </div>
                    <script>
                        function toggleCustomLogFile(select) {
                            const customInput = document.getElementById('custom_log_file');
                            if (select.value === 'custom') {
                                customInput.style.display = 'inline';
                            } else {
                                customInput.style.display = 'none';
                                customInput.value = '';
                                document.getElementById('log_file').value = select.value || '';
                            }
                        }
                        function updateLogFileValue(input) {
                            document.getElementById('log_file').value = input.value || '';
                        }
                    </script>
                    <div>
                        <label>data_type (str): 目标读取数据类型</label><br>
                        <select id="data_type">
                            <option value="thermo" selected>thermo</option>
                            <option value="mzML">mzML</option>
                            <option value="process">process</option>
                        </select>
                    </div>
                    <div>
                        <label>target_attr (str): 目标载入属性</label><br>
                        <select id="target_attr">
                            <option value="raw" selected>raw</option>
                            <option value="process">process</option>
                            <option value="mat">mat</option>
                            <option value="cell_mat">cell_mat</option>
                        </select>
                    </div>
                    <div><label>load_range (tuple[int,int]): 加载范围</label><br><input id="load_range" placeholder="如 0,100"></div>
                    <div>
                        <label>method (str): 加载方式</label><br>
                        <select id="load_method">
                            <option value="MultiThread" selected>MultiThread</option>
                            <option value="one by one">one by one</option>
                            <option value="MultiProcess">MultiProcess</option>
                        </select>
                    </div>
                    <button onclick="emitSocket('load', {
                        path: load_path.value,
                        log_file: log_file.value,
                        data_type: data_type.value,
                        target_attr: target_attr.value,
                        load_range: load_range.value ? load_range.value.split(',').map(Number) : null,
                        method: load_method.value
                    })">加载</button>
                </div>
                <div class="step-content" style="display:none">
                    <h2>Step 3: 预处理 (Process.pre_process)</h2>
                    <div><label>file_name (str 或 list):【Process.cut_offset】截取和偏移目标文件名，可英文逗号分隔</label><br><input id="pre_file_name" placeholder="文件名,可英文逗号分隔"></div>
                    <div><label>cut_range (tuple[int,int]):【Process.cut_offset】扫描帧截取范围</label><br><input id="pre_cut_range" placeholder="如 0,100"></div>
                    <div><label>offset (float):【Process.cut_offset】质荷比偏移量</label><br><input id="pre_offset" placeholder="offset"></div>
                    <div><label>res_mz (float):【Process.filter_occ】质荷比分辨率，决定合并精度</label><br><input id="pre_res_mz" placeholder="res_mz" value="0.01"></div>
                    <div><label>count (int):【Process.filter_occ】质荷比最小出现次数</label><br><input id="pre_count" placeholder="count" value="10"></div>
                    <div><label>clear_mem (bool):【Process.clear_memory】是否清理内存</label><br><select id="pre_clear_mem"><option value="false">否</option><option value="true">是</option></select></div><button onclick="emitSocket('pre_process', {
                        res_mz: parseFloat(pre_res_mz.value),
                        count: parseInt(pre_count.value),
                        file_name: pre_file_name.value ? (pre_file_name.value.includes(',') ? pre_file_name.value.split(',') : pre_file_name.value) : null,
                        offset: pre_offset.value ? parseFloat(pre_offset.value) : null,
                        cut_range: pre_cut_range.value ? pre_cut_range.value.split(',').map(Number) : null,
                        clear_mem: pre_clear_mem.value === 'true'
                    })">预处理</button>
                </div>
                <div class="step-content" style="display:none">
                    <h2>Step 4: 处理 (Process.process)</h2>
                    <div><label>min_intens (float):【Process.gen_mat】最小强度，生成矩阵阈值</label><br><input id="min_intens" placeholder="min_intens" value="0"></div>
                    <div><label>res_intens (float):【Process.round_mat】强度分辨率</label><br><input id="res_intens" placeholder="res_intens" value="0.01"></div>
                    <div><label>mz_interval (float):【Process.combine_peaks】m/z最大合并差值</label><br><input id="mz_interval" placeholder="mz_interval" value="0"></div>
                    <div><label>max_ratio (float):【Process.denoise】最大比值，细胞提取阈值</label><br><input id="max_ratio" placeholder="max_ratio" value="0.1"></div>
                    <div><label>adjacent (int):【Process.merge_cell】合并相邻细胞数</label><br><input id="adjacent" placeholder="adjacent" value="3"></div>
                    <div><label>snr (float):【Process.filter_assem】信噪比阈值</label><br><input id="snr" placeholder="snr" value="3.0"></div>
                    <div><label>threshold (float):【Process.filter_mat】过滤阈值</label><br><input id="threshold" placeholder="threshold" value="0.2"></div>
                    <div><label>lock_mz (bool):【Process.filter_mat】锁定m/z</label><br><select id="lock_mz"><option value="false">否</option><option value="true">是</option></select></div>
                    <div>
                        <label>filter_method (str):【Process.filter_mat】过滤方法</label><br>
                        <select id="filter_method">
                            <option value="all" selected>all</option>
                            <option value="any">any</option>
                        </select>
                    </div>
                    <div><label>clear_mem (bool):【Process.clear_memory】是否清理内存</label><br><select id="process_clear_mem"><option value="false">否</option><option value="true">是</option></select></div>
                    <button onclick="emitSocket('process', {
                        min_intens: parseFloat(min_intens.value),
                        res_intens: parseFloat(res_intens.value),
                        mz_interval: parseFloat(mz_interval.value),
                        max_ratio: parseFloat(max_ratio.value),
                        adjacent: parseInt(adjacent.value),
                        snr: parseFloat(snr.value),
                        threshold: parseFloat(threshold.value),
                        lock_mz: lock_mz.value === 'true',
                        filter_method: filter_method.value,
                        clear_mem: process_clear_mem.value === 'true'
                    })">处理</button>
                </div>
                <div class="step-content" style="display:none">
                    <h2>Step 5: 后处理 (Process.post_process)</h2>
                    <div><label>data (dict):【Process.post_process】数据对象</label><br><input id="post_data" placeholder="data (一般留空)"></div>
                    <div>
                        <label>normalize_method (list[str]):【Process.normalize】归一化方法</label><br>
                        <select id="normalize_method" multiple>
                            <option value="mz" selected>mz</option>
                            <option value="zscore">zscore</option>
                            <option value="max">max</option>
                            <option value="sum">sum</option>
                            <option value="quantile">quantile</option>
                            <option value="log">log</option>
                        </select>
                    </div>
                    <div>
                        <label>fillna_method (str):【Process.fill】缺失值填充方法</label><br>
                        <select id="fillna_method">
                            <option value="none" selected>none</option>
                            <option value="knn">knn</option>
                            <option value="zero">zero</option>
                        </select>
                    </div>
                    <button onclick="emitSocket('post_process', {
                        data: post_data.value || null,
                        normalize_method: Array.from(document.getElementById('normalize_method').selectedOptions).map(option => option.value),
                        fillna_method: fillna_method.value
                    })">后处理</button>
                </div>
                <div class="step-content" style="display:none">
                    <h2>Step 6: 保存 (Process.save)</h2>
                    <label>path (str):【Process.save】保存路径</label>
                    <input id="save_path" placeholder="path">
                    <button onclick="emitSocket('save', {path: save_path.value})">保存</button>
                </div>
            </div>
            <div class="resizer" id="resizer"></div>
            <div class="main-right" id="mainRight">
                <h2>终端输出</h2>
                <textarea id="output" readonly></textarea>
            </div>
        </div>
    <script>
        // 拖动分隔条调整宽度
        window.addEventListener('DOMContentLoaded', function() {
            const resizer = document.getElementById('resizer');
            const mainLeft = document.getElementById('mainLeft');
            const mainRight = document.getElementById('mainRight');
            let isDragging = false;
            let startX = 0;
            let startLeftWidth = 0;
            let startRightWidth = 0;
            resizer.addEventListener('mousedown', function(e) {
                isDragging = true;
                startX = e.clientX;
                startLeftWidth = mainLeft.offsetWidth;
                startRightWidth = mainRight.offsetWidth;
                resizer.classList.add('active');
                document.body.style.cursor = 'ew-resize';
            });
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const containerWidth = mainLeft.parentNode.offsetWidth;
                let newLeftWidth = startLeftWidth + dx;
                let newRightWidth = startRightWidth - dx;
                // 限制最小宽度
                const minLeft = 320, minRight = 260;
                if (newLeftWidth < minLeft) {
                    newLeftWidth = minLeft;
                    newRightWidth = containerWidth - minLeft - resizer.offsetWidth;
                }
                if (newRightWidth < minRight) {
                    newRightWidth = minRight;
                    newLeftWidth = containerWidth - minRight - resizer.offsetWidth;
                }
                mainLeft.style.width = (100 * newLeftWidth / containerWidth) + '%';
                mainRight.style.width = (100 * newRightWidth / containerWidth) + '%';
            });
            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    resizer.classList.remove('active');
                    document.body.style.cursor = '';
                }
            });
        });
    </script>
    </div>
</body>

</html>
